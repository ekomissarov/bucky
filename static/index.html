<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bucky A/B Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; margin-top: 20px; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        th:first-child, td:first-child { text-align: left; }
        th { background: #f3f3f3; }
        .positive { background: #90ff90; }
        .positive-strong { background: green; color: white; }
        .negative { background: #ff9090; }
        .negative-strong { background: red; color: white; }
    </style>
</head>
<body>
<h2>Bucky A/B Dashboard</h2>

<label>Experiment:
    <select id="experiment" onchange="experimentChanged()">

    </select>
</label>

<label>Country:
    <select id="country" onchange="countryChanged()">
        <option value="">All</option>
    </select>
</label>

<label>|t-stat| ≥
    <input id="minTstat" type="number" value="0" step="0.1">
</label>

<button onclick="loadResults()">Run</button>

<div id="summary"></div>

<table>
    <thead>
    <tr>
        <th>Metric</th>
        <th>Control</th>
        <th>Treatment</th>
        <th>Metric control</th>
        <th>Metric treatment</th>
        <th>User-days control</th>
        <th>User-days treatment</th>
        <th>Effect %</th>
        <th>t-stat</th>
        <th>MDE %</th>
        <th>CI low</th>
        <th>CI high</th>
    </tr>
    </thead>
    <tbody id="results"></tbody>
</table>

<script>
async function loadSummary() {
    const experiment = document.getElementById("experiment").value;
    const country = document.getElementById("country").value;

    let url = `/api/summary?experiment=${encodeURIComponent(experiment)}`;
    if (country) url += `&country=${encodeURIComponent(country)}`;

    const response = await fetch(url);
    const s = await response.json();

    document.getElementById("summary").innerHTML = `
        <b>${s.date_from}</b> — <b>${s.date_to}</b>
        &nbsp; | &nbsp; Countries: <b>${s.countries}</b>
        &nbsp; | &nbsp; Groups: <b>${s.groups}</b>
        &nbsp; | &nbsp; Buckets: <b>${s.buckets}</b>
        &nbsp; | &nbsp; User-days: <b>${number(s.user_days)}</b>
    `;
}

function number(x, digits = 0) {
    return x == null ? "" : Number(x).toLocaleString("en-US", {minimumFractionDigits: digits, maximumFractionDigits: digits}).replaceAll(",", " ");
}

function decimal(x, digits = 3) {
    return x == null ? "" : Number(x).toFixed(digits);
}

async function loadCountries() {
    const experiment = document.getElementById("experiment").value;
    const response = await fetch(`/api/countries?experiment=${encodeURIComponent(experiment)}`);
    const countries = await response.json();
    const select = document.getElementById("country");

    select.innerHTML = '<option value="">All</option>';
    for (const country of countries) {
        const option = document.createElement("option");
        option.value = country;
        option.textContent = country;
        select.appendChild(option);
    }
}
async function loadExperiments() {
    const response = await fetch("/api/experiments");
    const experiments = await response.json();
    const select = document.getElementById("experiment");

    select.innerHTML = "";
    for (const experiment of experiments) {
        const option = document.createElement("option");
        option.value = experiment;
        option.textContent = experiment;
        select.appendChild(option);
    }
}

async function experimentChanged() {
    await loadCountries();
    await loadSummary();
    await loadResults();
}

async function countryChanged() {
    await loadSummary();
    await loadResults();
}

async function loadResults() {
    const experiment = document.getElementById("experiment").value;
    const country = document.getElementById("country").value;
    const minTstat = document.getElementById("minTstat").value;

    let url = `/api/results?experiment=${encodeURIComponent(experiment)}&min_tstat=${minTstat}`;
    if (country) url += `&country=${encodeURIComponent(country)}`;

    const response = await fetch(url);
    const data = await response.json();
    const tbody = document.getElementById("results");
    tbody.innerHTML = "";

    for (const row of data) {
        const tr = document.createElement("tr");
        const strong = Math.abs(row.effect_size_pct) >= row.monitoring_mde_pct;
        const effectClass = row.tstat_obs >= 3 ? (strong ? "positive-strong" : "positive")
                          : row.tstat_obs <= -3 ? (strong ? "negative-strong" : "negative") : "";

        tr.innerHTML = `
            <td>${row.metric}</td>
            <td>${row.control}</td>
            <td>${row.treatment}</td>
            <td>${number(row.metric_control)}</td>
            <td>${number(row.metric_treatment)}</td>
            <td>${number(row.userday_control)}</td>
            <td>${number(row.userday_treatment)}</td>
            <td class="${effectClass}">${decimal(row.effect_size_pct)}</td>
            <td>${decimal(Math.abs(row.tstat_obs), 2)}</td>
            <td>${decimal(row.monitoring_mde_pct)}</td>
            <td>${decimal(row.CI_low_effect)}</td>
            <td>${decimal(row.CI_high_effect)}</td>
        `;
        tbody.appendChild(tr);
    }
}

async function init() {
    await loadExperiments();
    await loadCountries();
    await loadSummary();
    await loadResults();
}

init();
</script>
</body>
</html>
